<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Конспект</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Конспект">
<style>
  :root{
    --paper:#EEF1F6;
    --paper2:#E3E9F2;
    --card:#FFFFFF;
    --grid:rgba(27,42,74,0.07);
    --ink:#1B2A4A;
    --ink-soft:#5B6B8C;
    --ink-faint:#8C97B3;
    --red:#C1443D;
    --green:#3F7D58;
    --gold:#B9812A;
    --line:#D3DAE6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 28px);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; margin:0;}
  header{
    padding:18px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-shrink:0;
  }
  header h1{font-size:22px; font-weight:600; letter-spacing:0.2px;}
  header .date{font-size:12px; color:var(--ink-faint);}
  main{
    flex:1;
    overflow-y:auto;
    padding:4px 16px 100px;
    -webkit-overflow-scrolling:touch;
  }
  .view{display:none;}
  .view.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:translateY(0)}}

  .empty{
    text-align:center;
    color:var(--ink-faint);
    padding:60px 20px;
    font-size:14px;
    line-height:1.6;
  }
  .empty svg{margin-bottom:10px; opacity:.5;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:0 1px 0 rgba(27,42,74,0.03);
  }
  .card-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .note-title{font-weight:600; font-size:15px; margin-bottom:4px;}
  .note-text{font-size:13.5px; color:var(--ink-soft); white-space:pre-wrap; line-height:1.5;}
  .note-meta{font-size:11px; color:var(--ink-faint); margin-top:8px;}

  .icon-btn{
    border:none; background:transparent; color:var(--ink-faint);
    cursor:pointer; padding:4px; line-height:0; flex-shrink:0;
  }
  .icon-btn:active{color:var(--red);}

  /* Flashcards */
  .deck-count{font-size:12px; color:var(--ink-faint); margin:2px 0 14px;}
  .study-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; margin-bottom:16px;
    background:var(--ink); color:var(--paper);
    border:none; border-radius:10px; font-size:14.5px; font-weight:600;
    cursor:pointer;
  }
  .study-btn:disabled{background:var(--line); color:var(--ink-faint);}

  .flash-front{font-weight:600; font-size:14.5px;}
  .flash-back{font-size:13px; color:var(--ink-soft); margin-top:3px;}

  .review-wrap{
    display:flex; flex-direction:column; align-items:center; padding-top:10px;
  }
  .flip-card{
    width:100%; max-width:340px; height:220px;
    perspective:1200px; margin-bottom:22px;
  }
  .flip-inner{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d; transition:transform .45s;
  }
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    backface-visibility:hidden;
    font-size:18px; font-weight:600;
    box-shadow:0 2px 10px rgba(27,42,74,0.06);
  }
  .flip-face.back{transform:rotateY(180deg); color:var(--ink-soft); font-weight:500; font-size:16px;}
  .flip-hint{font-size:11.5px; color:var(--ink-faint); margin-top:-14px; margin-bottom:20px;}
  .review-actions{display:flex; gap:10px; width:100%; max-width:340px;}
  .review-actions button{
    flex:1; padding:13px 0; border-radius:10px; border:none; font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-again{background:#F5E4E2; color:var(--red);}
  .btn-know{background:#E1EEE5; color:var(--green);}
  .review-progress{font-size:12px; color:var(--ink-faint); margin-bottom:14px;}
  .review-done{text-align:center; padding:40px 20px;}
  .review-done h3{margin-bottom:8px;}

  /* Planner */
  .task-row{display:flex; align-items:flex-start; gap:12px;}
  .check{
    width:21px; height:21px; border-radius:50%; border:2px solid var(--ink-faint);
    flex-shrink:0; margin-top:1px; cursor:pointer; position:relative;
  }
  .check.done{background:var(--green); border-color:var(--green);}
  .check.done::after{
    content:""; position:absolute; left:5px; top:1px; width:6px; height:10px;
    border:solid white; border-width:0 2px 2px 0; transform:rotate(45deg);
  }
  .task-text{font-size:14.5px; flex:1;}
  .task-text.done{text-decoration:line-through; color:var(--ink-faint);}
  .task-date{font-size:11.5px; color:var(--ink-faint); margin-top:3px;}
  .task-date.overdue{color:var(--red); font-weight:600;}

  /* YouTube / Minecraft videos */
  .yt-card{cursor:pointer;}
  .yt-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .yt-title{font-weight:600; font-size:15px; flex:1;}
  .yt-progress-row{display:flex; align-items:center; gap:8px; margin-top:9px;}
  .yt-bar{flex:1; height:6px; border-radius:4px; background:var(--line); overflow:hidden;}
  .yt-bar-fill{height:100%; background:var(--gold); border-radius:4px; transition:width .2s;}
  .yt-bar-fill.done{background:var(--green);}
  .yt-progress-label{font-size:11px; color:var(--ink-faint); flex-shrink:0;}
  .yt-tag{
    font-size:10.5px; padding:2px 8px; border-radius:10px; background:#E1EEE5; color:var(--green);
    flex-shrink:0; font-weight:600;
  }
  .yt-checklist{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px;}
  .yt-check-item{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13.5px;}
  .yt-check-item span{flex:1;}
  .yt-check-item.checked span{color:var(--ink-faint); text-decoration:line-through;}
  .check-sq{
    width:19px; height:19px; border-radius:5px; border:2px solid var(--ink-faint);
    flex-shrink:0; position:relative;
  }
  .check-sq.done{background:var(--green); border-color:var(--green);}
  .check-sq.done::after{
    content:""; position:absolute; left:4px; top:0px; width:6px; height:10px;
    border:solid white; border-width:0 2px 2px 0; transform:rotate(45deg);
  }
  .section-heading{font-size:14px; font-weight:600; color:var(--ink-soft); margin:20px 0 10px !important;}

  /* Channel card */
  .connect-card{
    background:var(--card); border:1px dashed var(--line); border-radius:12px;
    padding:22px 18px; text-align:center; margin-bottom:4px;
  }
  .connect-card svg{opacity:.5; margin-bottom:8px;}
  .connect-card p{font-size:13px; color:var(--ink-faint); margin:4px 0 14px; line-height:1.5;}
  .connect-btn{
    background:var(--ink); color:var(--paper); border:none; padding:11px 20px;
    border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .channel-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:4px;}
  .channel-head{display:flex; align-items:center; gap:12px;}
  .channel-avatar{width:48px; height:48px; border-radius:50%; object-fit:cover; flex-shrink:0; background:var(--paper2);}
  .channel-name{font-weight:600; font-size:15.5px;}
  .channel-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .channel-stats{display:flex; margin:16px 0 12px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:12px 0;}
  .stat-box{flex:1; text-align:center;}
  .stat-num{font-weight:700; font-size:16px;}
  .stat-label{font-size:10.5px; color:var(--ink-faint); margin-top:2px;}
  .channel-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--ink-faint); margin-bottom:2px;}
  .channel-foot button{background:none; border:none; color:var(--ink-faint); font-size:11.5px; cursor:pointer; text-decoration:underline; padding:2px;}
  .upload-list{margin-top:10px;}
  .upload-item{display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line);}
  .upload-item:first-child{border-top:none;}
  .upload-thumb{width:88px; height:50px; border-radius:6px; object-fit:cover; flex-shrink:0; background:var(--paper2);}
  .upload-title{font-size:13px; font-weight:600; line-height:1.3;}
  .upload-meta{font-size:11px; color:var(--ink-faint); margin-top:4px;}

  /* Yt sub-nav pills */
  .yt-subnav{display:flex; gap:6px; margin:2px 0 14px; overflow-x:auto;}
  .yt-sub-btn{
    flex-shrink:0; padding:7px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); font-size:13px; cursor:pointer;
  }
  .yt-sub-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .yt-sub-view{display:none;}
  .yt-sub-view.active{display:block;}

  /* Idea bank */
  .idea-row{display:flex; align-items:center; gap:10px;}
  .idea-text{flex:1; font-size:14px;}
  .idea-promote{
    border:none; background:#E1EEE5; color:var(--green); font-size:11.5px; font-weight:600;
    padding:6px 10px; border-radius:8px; cursor:pointer; flex-shrink:0; white-space:nowrap;
  }

  /* AI chat */
  .ai-hero{text-align:center; padding:20px 16px;}
  .ai-hero p{font-size:13px; color:var(--ink-soft); line-height:1.55; margin:6px 0 14px;}
  .prompt-item{
    display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line);
  }
  .prompt-item:first-child{border-top:none;}
  .prompt-text{flex:1; font-size:13px; color:var(--ink);}
  .copy-btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    font-size:11.5px; padding:6px 10px; border-radius:8px; cursor:pointer; flex-shrink:0;
  }
  .ai-inline-head{display:flex; justify-content:space-between; align-items:center;}
  .gear-btn{border:none; background:none; color:var(--ink-faint); cursor:pointer; padding:4px;}
  .chat-box{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .msg{max-width:82%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; white-space:pre-wrap;}
  .msg.user{align-self:flex-end; background:var(--ink); color:var(--paper); border-bottom-right-radius:4px;}
  .msg.bot{align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .msg.system{align-self:center; background:#F5E4E2; color:var(--red); font-size:12px; text-align:center;}
  .chat-input-row{display:flex; gap:8px; margin-top:12px;}
  .chat-input-row input{
    flex:1; border:1px solid var(--line); border-radius:20px; padding:10px 16px;
    font-size:13.5px; font-family:inherit; background:var(--card);
  }
  .chat-send{
    width:40px; height:40px; border-radius:50%; border:none; background:var(--ink); color:var(--paper);
    flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .chat-send:disabled{background:var(--line);}

  /* Schedule chips */
  .weekday-row{display:flex; gap:6px; margin-top:10px;}
  .weekday-chip{
    flex:1; text-align:center; padding:9px 0; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-faint); font-size:12px; cursor:pointer;
  }
  .weekday-chip.on{background:var(--gold); border-color:var(--gold); color:#fff; font-weight:600;}

  /* Goal tracker */
  .goal-row{display:flex; gap:8px; align-items:center; margin-top:10px;}
  .goal-row input{flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; background:var(--card); color:var(--ink);}
  .goal-row button{border:none; background:var(--ink); color:var(--paper); border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer;}
  .goal-bar-wrap{margin-top:12px;}
  .goal-bar{height:8px; border-radius:4px; background:var(--line); overflow:hidden;}
  .goal-bar-fill{height:100%; background:var(--gold); border-radius:4px;}
  .goal-caption{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}

  /* Growth chart */
  .chart-wrap{margin-top:8px;}
  .chart-bars{display:flex; align-items:flex-end; gap:6px; height:90px;}
  .chart-bar{flex:1; background:var(--gold); border-radius:4px 4px 0 0; min-height:3px; position:relative;}
  .chart-labels{display:flex; gap:6px; margin-top:6px;}
  .chart-labels span{flex:1; text-align:center; font-size:9.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* Idea roulette */
  .roulette-box{
    background:var(--paper2); border:1px dashed var(--line); border-radius:10px;
    padding:14px; text-align:center; margin-bottom:14px;
  }
  .roulette-result{font-size:14px; font-weight:600; margin:8px 0 12px; min-height:20px;}
  .roulette-actions{display:flex; gap:8px; justify-content:center;}
  .roulette-actions button{
    border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .btn-roll{background:var(--ink); color:var(--paper);}
  .btn-save-idea{background:#E1EEE5; color:var(--green);}

  /* Tools generators */
  .gen-row{display:flex; gap:8px; margin-bottom:12px;}
  .gen-row input{flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; background:var(--card); color:var(--ink);}
  .gen-row button{border:none; background:var(--ink); color:var(--paper); border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer;}
  .gen-result-item{
    display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px;
  }
  .gen-result-item:first-child{border-top:none;}
  .gen-result-item span{flex:1;}
  .tag-chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
  .tag-chip{
    border:1px solid var(--line); background:var(--card); border-radius:14px; padding:5px 11px;
    font-size:12px; color:var(--ink-soft); cursor:pointer;
  }
  .desc-output{
    width:100%; min-height:120px; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    font-size:13px; font-family:inherit; background:var(--card); color:var(--ink); margin-top:4px; resize:vertical;
  }

  /* Thumbnail builder */
  .thumb-canvas-wrap{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px;
    display:flex; justify-content:center; overflow:hidden; touch-action:none;
  }
  #thumbCanvas{width:100%; max-width:480px; height:auto; border-radius:6px; background:#0d1524; touch-action:none;}
  .thumb-upload-btn{
    display:block; width:100%; text-align:center; padding:11px; margin-top:10px;
    border:1px dashed var(--line); border-radius:8px; background:var(--card); color:var(--ink-soft);
    font-size:13px; cursor:pointer;
  }
  .thumb-controls{margin-top:14px;}
  .thumb-row{display:flex; gap:8px; margin-bottom:10px;}
  .thumb-row input[type="text"]{
    flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px;
    font-size:14px; background:var(--card); color:var(--ink);
  }
  .thumb-preset-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .thumb-preset{
    width:38px; height:38px; border-radius:8px; border:2px solid var(--line); cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;
  }
  .thumb-preset.active{border-color:var(--ink);}
  .thumb-mini-label{font-size:11.5px; color:var(--ink-faint); margin:10px 0 6px;}
  .thumb-slider-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .thumb-slider-row input[type="range"]{flex:1;}
  .thumb-slider-row span{font-size:11.5px; color:var(--ink-faint); width:34px; text-align:right;}
  .sticker-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .sticker-btn{
    width:40px; height:40px; border-radius:8px; border:1px solid var(--line); background:var(--card);
    font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .thumb-tool-btns{display:flex; gap:8px; margin-bottom:10px;}
  .thumb-tool-btns button{
    flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    border-radius:8px; padding:9px 0; font-size:12.5px; cursor:pointer;
  }
  .thumb-tool-btns button.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .thumb-download-btn{
    width:100%; border:none; background:var(--green); color:#fff; border-radius:9px;
    padding:12px 0; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px;
  }
  .thumb-history{display:flex; gap:8px; overflow-x:auto; margin-top:6px;}
  .thumb-history img{width:84px; height:47px; border-radius:6px; object-fit:cover; border:1px solid var(--line); flex-shrink:0;}

  /* Editing / organization tab */
  .rec-timer-box{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; text-align:center;
  }
  .rec-timer-display{font-size:32px; font-weight:700; font-family:ui-monospace,monospace; margin:6px 0 14px;}
  .rec-timer-btns{display:flex; gap:8px; justify-content:center;}
  .rec-timer-btns button{
    border:none; border-radius:9px; padding:11px 18px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn-mark{background:var(--gold); color:#fff;}
  .btn-timer-toggle{background:var(--ink); color:var(--paper);}
  .btn-timer-reset{background:var(--card); color:var(--ink-soft); border:1px solid var(--line) !important;}
  .mark-list-item{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px;}
  .mark-list-item:first-child{border-top:none;}
  .mark-time{font-family:ui-monospace,monospace; color:var(--gold); font-weight:600; flex-shrink:0;}
  .mark-list-item span.mtext{flex:1;}
  .duration-row{display:flex; gap:8px; align-items:center; margin-bottom:10px;}
  .duration-row label{font-size:12.5px; color:var(--ink-soft); width:80px; flex-shrink:0;}
  .duration-row input{flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; background:var(--card); color:var(--ink);}
  .duration-total{font-size:13.5px; font-weight:600; margin-top:6px; text-align:right;}
  .kbd-row{display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--line); font-size:13px;}
  .kbd-row:first-child{border-top:none;}
  .kbd{background:var(--paper2); border:1px solid var(--line); border-radius:5px; padding:2px 8px; font-family:ui-monospace,monospace; font-size:12px;}
  .shorts-result{text-align:center; padding:14px; border-radius:10px; margin-top:10px; font-weight:600; font-size:14px;}
  .shorts-result.yes{background:#E1EEE5; color:var(--green);}
  .shorts-result.no{background:#F5E4E2; color:var(--red);}
  .cross-list{display:flex; flex-direction:column; gap:0;}
  .cross-item{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line);}
  .cross-item:first-child{border-top:none;}
  .cross-item span{flex:1; font-size:14px;}
  .milestone-row{display:flex; gap:8px; margin-bottom:10px;}
  .milestone-row input{flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; background:var(--card); color:var(--ink);}
  .milestone-item{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px;}
  .milestone-item:first-child{border-top:none;}
  .streak-box{text-align:center; padding:16px;}
  .streak-num{font-size:38px; font-weight:800; color:var(--gold);}
  .streak-label{font-size:12px; color:var(--ink-faint); margin-top:2px;}

  /* FAB */
  .fab{
    position:fixed; right:18px; bottom:88px;
    width:52px; height:52px; border-radius:50%;
    background:var(--ink); color:var(--paper);
    border:none; font-size:26px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(27,42,74,0.28); cursor:pointer; z-index:20;
  }

  nav{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--card); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
    z-index:15;
  }
  nav button{
    flex:1; background:none; border:none; padding:10px 0 8px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint); font-size:11px; cursor:pointer;
  }
  nav button.active{color:var(--ink);}
  nav svg{width:22px; height:22px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(27,42,74,0.35);
    display:flex; align-items:flex-end; z-index:30;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--paper2); width:100%;
    border-radius:18px 18px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .25s ease;
    max-height:82vh; overflow-y:auto;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet h3{margin-bottom:14px; font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    font-size:14.5px; font-family:inherit; background:var(--card); color:var(--ink);
  }
  .field textarea{min-height:80px; resize:vertical;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions button{
    flex:1; padding:12px 0; border-radius:9px; border:none; font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-cancel{background:var(--card); color:var(--ink-soft); border:1px solid var(--line) !important;}
  .btn-save{background:var(--ink); color:var(--paper);}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-40px);
    background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:20px;
    font-size:12.5px; opacity:0; transition:all .25s; z-index:50; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>

var qrcode = function() {

    var PAD1 = 0x11;

    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = new Array();

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )

          } else {
            _modules[row + r][col + c] = false;
          }
        }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {

        }

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

            if (_modules[row][col - c] == null) {

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {

          if (row < 0 || _moduleCount <= row) {

            break;

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        for (var i = 0; i < ecdata[r].length; i += 1) {

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            index += 1;
          }
        }

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      }

      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data) {
      var newData = qr8BitByte(data);
      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {

      var c, mc, r, mr, qrSvg='', rect;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg';
      qrSvg += ' width="' + size + 'px"';
      qrSvg += ' height="' + size + 'px"';
      qrSvg += ' xmlns="http://www.w3.org/2000/svg"';
      qrSvg += '>';
      qrSvg += '<rect width="100%" height="100%" fill="white"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {

    var bytes = new Array();
    for (var i = 0; i < s.length; i += 1) {
      var c = s.charCodeAt(i);
      bytes.push(c & 0xff);
    }
    return bytes;
  };

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7

      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],
      [6, 28, 54, 80, 106],
      [6, 32, 58, 84, 110],
      [6, 30, 58, 86, 114],
      [6, 34, 62, 90, 118],
      [6, 26, 50, 74, 98, 122],
      [6, 30, 54, 78, 102, 126],
      [6, 26, 52, 78, 104, 130],
      [6, 30, 56, 82, 108, 134],
      [6, 34, 60, 86, 112, 138],
      [6, 30, 58, 86, 114, 142],
      [6, 34, 62, 90, 118, 146],
      [6, 30, 54, 78, 102, 126, 150],
      [6, 24, 50, 76, 102, 128, 154],
      [6, 28, 54, 80, 106, 132, 158],
      [6, 32, 58, 84, 110, 136, 162],
      [6, 26, 54, 82, 110, 138, 166],
      [6, 30, 58, 86, 114, 142, 170]
    ];
    var G15 = (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0);
    var G18 = (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0);
    var G15_MASK = (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1);

    var _this = {};

    var getBCHDigit = function(data) {
      var digit = 0;
      while (data != 0) {
        digit += 1;
        data >>>= 1;
      }
      return digit;
    };

    _this.getBCHTypeInfo = function(data) {
      var d = data << 10;
      while (getBCHDigit(d) - getBCHDigit(G15) >= 0) {
        d ^= (G15 << (getBCHDigit(d) - getBCHDigit(G15) ) );
      }
      return ( (data << 10) | d) ^ G15_MASK;
    };

    _this.getBCHTypeNumber = function(data) {
      var d = data << 12;
      while (getBCHDigit(d) - getBCHDigit(G18) >= 0) {
        d ^= (G18 << (getBCHDigit(d) - getBCHDigit(G18) ) );
      }
      return (data << 12) | d;
    };

      return PATTERN_POSITION_TABLE[typeNumber - 1];

    _this.getMaskFunction = function(maskPattern) {

      switch (maskPattern) {

      case QRMaskPattern.PATTERN000 :
        return function(i, j) { return (i + j) % 2 == 0; };
      case QRMaskPattern.PATTERN001 :
        return function(i, j) { return i % 2 == 0; };
      case QRMaskPattern.PATTERN010 :
        return function(i, j) { return j % 3 == 0; };
      case QRMaskPattern.PATTERN011 :
        return function(i, j) { return (i + j) % 3 == 0; };
      case QRMaskPattern.PATTERN100 :
        return function(i, j) { return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 == 0; };
      case QRMaskPattern.PATTERN101 :
        return function(i, j) { return (i * j) % 2 + (i * j) % 3 == 0; };
      case QRMaskPattern.PATTERN110 :
        return function(i, j) { return ( (i * j) % 2 + (i * j) % 3) % 2 == 0; };
      case QRMaskPattern.PATTERN111 :
        return function(i, j) { return ( (i * j) % 3 + (i + j) % 2) % 2 == 0; };

      return a;
    };

        case QRMode.MODE_ALPHA_NUM : return 9;
        case QRMode.MODE_8BIT_BYTE : return 8;

          throw new Error('mode:' + mode);
        }

        case QRMode.MODE_NUMBER    : return 12;
        case QRMode.MODE_ALPHA_NUM : return 11;
        case QRMode.MODE_8BIT_BYTE : return 16;
        case QRMode.MODE_KANJI     : return 10;
        default :
          throw new Error('mode:' + mode);
        }

        switch(mode) {

function startReview(){
  const due = state.cards.filter(c=>!c.nextReview || c.nextReview <= Date.now());
  state.reviewQueue = (due.length ? due : state.cards).map(c=>c.id);
  state.reviewIndex = 0;
  state.reviewFlipped = false;
  renderReview();
}
function renderReview(){
  const el = document.getElementById('view-cards');
  if(state.reviewIndex >= state.reviewQueue.length){

    state.reviewQueue = [];
    setTimeout(renderCards, 1400);
    return;
  }
  const card = state.cards.find(c=>c.id===state.reviewQueue[state.reviewIndex]);
  if(!card){ state.reviewIndex++; return renderReview(); }
  el.innerHTML = `
    <div class="review-wrap">
      <div class="review-progress">${state.reviewIndex+1} из ${state.reviewQueue.length}</div>

function answerCard(id, knew){
  const card = state.cards.find(c=>c.id===id);

/* ---------- PLANNER ---------- */
function renderTasks(){
  const el = document.getElementById('view-plan');
  if(state.tasks.length === 0){
    el.innerHTML = emptyState('Список дел пуст', 'Добавьте задачу — с дедлайном или без.');
    return;
  }
  const sorted = [...state.tasks].sort((a,b)=>{
    if(a.done !== b.done) return a.done ? 1 : -1;
    if(a.due && b.due) return a.due - b.due;
    if(a.due) return -1;
    if(b.due) return 1;
    return b.created - a.created;
  });
  const today = new Date(); today.setHours(0,0,0,0);
  el.innerHTML = sorted.map(t => {
    const overdue = t.due && !t.done && t.due < today.getTime();
    return `
    <div class="card">
      <div class="task-row">
        <div class="check ${t.done?'done':''}" onclick="toggleTask('${t.id}')"></div>
        <div style="flex:1">
          <div class="task-text ${t.done?'done':''}">${escapeHtml(t.text)}</div>
          ${t.due ? `<div class="task-date ${overdue?'overdue':''}">${new Date(t.due).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</div>` : ''}
        </div>
        <button class="icon-btn" onclick="deleteTask('${t.id}')">${trashIcon()}</button>
      </div>
    </div>`;
  }).join('');
}
function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(t){ t.done = !t.done; save('tasks', state.tasks); renderTasks(); }
}
function deleteTask(id){

}

/* ---------- CHANNEL (YouTube Data API, public data only) ---------- */
function formatNum(n){
  if(n === null || n === undefined) return '—';
  return Number(n).toLocaleString('ru-RU');
}
async function resolveChannel(apiKey, rawInput){
  const input = rawInput.trim();
  let url;
  if(/^UC[\w-]{22}$/.test(input)){
    url = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&id=${encodeURIComponent(input)}&key=${apiKey}`;
  } else {
    const handle = input.replace(/^@/, '');
    url = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&forHandle=${encodeURIComponent(handle)}&key=${apiKey}`;
  }
  let data = await (await fetch(url)).json();
  if(data.error) throw new Error(data.error.message || 'Ошибка API');
  if(!data.items || !data.items.length){
    const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&maxResults=1&q=${encodeURIComponent(input)}&key=${apiKey}`;
    const sData = await (await fetch(searchUrl)).json();
    if(sData.error) throw new Error(sData.error.message || 'Ошибка API');
    const chId = sData.items && sData.items[0] && sData.items[0].id && sData.items[0].id.channelId;
    if(!chId) throw new Error('Канал не найден');
    const url2 = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&id=${chId}&key=${apiKey}`;
    data = await (await fetch(url2)).json();
    if(data.error) throw new Error(data.error.message || 'Ошибка API');
  }
  if(!data.items || !data.items.length) throw new Error('Канал не найден');
  return data.items[0];
}
async function fetchUploads(apiKey, uploadsPlaylistId, max){
  const plUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=${max}&playlistId=${uploadsPlaylistId}&key=${apiKey}`;
  const plData = await (await fetch(plUrl)).json();
  if(plData.error) throw new Error(plData.error.message || 'Ошибка API');
  const items = plData.items || [];
  const ids = items.map(i => i.snippet.resourceId.videoId).filter(Boolean);
  let statMap = {};
  if(ids.length){
    const vUrl = `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${ids.join(',')}&key=${apiKey}`;
    const vData = await (await fetch(vUrl)).json();
    (vData.items || []).forEach(v => statMap[v.id] = v.statistics);
  }
  return items.map(i => {
    const vid = i.snippet.resourceId.videoId;
    const thumbs = i.snippet.thumbnails || {};
    return {
      id: vid,
      title: i.snippet.title,
      thumbnail: (thumbs.medium || thumbs.default || {}).url || '',
      publishedAt: i.snippet.publishedAt,
      views: statMap[vid] ? statMap[vid].viewCount : null
    };
  });
}
async function refreshChannel(notify){
  if(!state.channel || !state.channel.apiKey) return;
  state.channelLoading = true;
  renderChannelBlock();
  try{
    const ch = await resolveChannel(state.channel.apiKey, state.channel.channelInput);
    const uploadsPlaylist = ch.contentDetails && ch.contentDetails.relatedPlaylists && ch.contentDetails.relatedPlaylists.uploads;
    const uploads = uploadsPlaylist ? await fetchUploads(state.channel.apiKey, uploadsPlaylist, 6) : [];
    const thumbs = ch.snippet.thumbnails || {};
    state.channel.data = {
      title: ch.snippet.title,
      avatar: (thumbs.medium || thumbs.default || {}).url || '',
      subs: ch.statistics.hiddenSubscriberCount ? null : ch.statistics.subscriberCount,
      views: ch.statistics.viewCount,
      videoCount: ch.statistics.videoCount,
      uploads,
      fetchedAt: Date.now()
    };
    await save('ytChannel', state.channel);
    if(notify) showToast('Канал обновлён');
  }catch(e){
    console.error(e);
    showToast('Не удалось обновить канал: ' + (e.message || 'ошибка'));
  }
  state.channelLoading = false;
  renderChannelBlock();
}

function calcStreak(){
  if(!state.streakLog.length) return 0;
  const weeks = new Set(state.streakLog.map(d => {
    const dt = new Date(d);
    const onejan = new Date(dt.getFullYear(),0,1);
    const week = Math.ceil((((dt - onejan) / 86400000) + onejan.getDay()+1)/7);
    return dt.getFullYear() + '-' + week;
  }));
  let streak = 0;
  const now = new Date();
  for(let i=0;i<104;i++){
    const d = new Date(now); d.setDate(d.getDate() - i*7);
    const onejan = new Date(d.getFullYear(),0,1);
    const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
    const key = d.getFullYear() + '-' + week;
    if(weeks.has(key)) streak++;
    else if(i>0) break;
  }
  return streak;
}
function markPublishedToday(){
  const today = new Date().toISOString().slice(0,10);
  if(!state.streakLog.includes(today)){
    state.streakLog.push(today);
    if(state.streakLog.length > 400) state.streakLog = state.streakLog.slice(-400);
    save('ytStreakLog', state.streakLog);
  }
  renderChannelBlock();
  showToast('Отмечено!');
}

function checkMilestones(){
  const subs = state.channel && state.channel.data ? state.channel.data.subs : null;
  if(subs === null || subs === undefined) return;
  let changed = false;
  state.milestones.forEach(m => {
    if(!m.achievedDate && subs >= m.target){ m.achievedDate = Date.now(); changed = true; }
  });
  if(changed) save('ytMilestones', state.milestones);
}
function generateChannelQR(){
  let url = 'https://youtube.com';
  if(state.channel && state.channel.channelInput){
    const handle = state.channel.channelInput.replace(/^@/,'');
    url = 'https://youtube.com/@' + handle;
  } else if(state.channel && state.channel.data && state.channel.data.title){
    url = 'https://youtube.com/results?search_query=' + encodeURIComponent(state.channel.data.title);
  } else {
    showToast('Сначала привяжите канал');
    return;
  }
  const container = document.getElementById('qr-container');
  container.innerHTML = '';
  try{
    let qr = null;
    for(let t=1; t<=15; t++){
      try{ qr = qrcode(t, 'M'); qr.addData(url); qr.make(); break; }
      catch(e){ qr = null; }
    }
    if(!qr) throw new Error('too long');
    container.innerHTML = qr.createSvgTag(5, 4);
  }catch(e){
    console.error(e);
    showToast('Не удалось создать QR');
  }
}

function setupThumbCanvas(){
  const canvas = document.getElementById('thumbCanvas');
  if(!canvas || canvas.dataset.bound) return;
  canvas.dataset.bound = '1';
  canvas.addEventListener('pointerdown', e=>{
    const pos = getCanvasPos(e, canvas);
    if(state.thumb.tool === 'arrow' || state.thumb.tool === 'circle'){
      state.thumb.drawStart = pos;
      return;
    }
    const idx = hitTestThumb(pos.x, pos.y);
    if(idx >= 0){
      state.thumb.dragIdx = idx;
      state.thumb.dragOffset = { x: pos.x - state.thumb.objects[idx].x, y: pos.y - state.thumb.objects[idx].y };
    }
  });
  canvas.addEventListener('pointermove', e=>{
    const pos = getCanvasPos(e, canvas);
    if((state.thumb.tool === 'arrow' || state.thumb.tool === 'circle') && state.thumb.drawStart){
      redrawThumbCanvas();
      const ctx = canvas.getContext('2d');
      if(state.thumb.tool === 'arrow') drawArrow(ctx, state.thumb.drawStart.x, state.thumb.drawStart.y, pos.x, pos.y);
      else {
        const dx = pos.x - state.thumb.drawStart.x, dy = pos.y - state.thumb.drawStart.y;
        ctx.beginPath(); ctx.arc(state.thumb.drawStart.x, state.thumb.drawStart.y, Math.sqrt(dx*dx+dy*dy), 0, Math.PI*2);
        ctx.strokeStyle = '#FF3B30'; ctx.lineWidth = 8; ctx.stroke();
      }
    } else if(state.thumb.dragIdx >= 0){
      const o = state.thumb.objects[state.thumb.dragIdx];
      o.x = pos.x - state.thumb.dragOffset.x;
      o.y = pos.y - state.thumb.dragOffset.y;
      redrawThumbCanvas();
    }
  });
  const finishDraw = e=>{
    const pos = getCanvasPos(e, canvas);
    if(state.thumb.tool === 'arrow' && state.thumb.drawStart){
      state.thumb.objects.push({ type:'arrow', x1:state.thumb.drawStart.x, y1:state.thumb.drawStart.y, x2:pos.x, y2:pos.y });
      state.thumb.drawStart = null; state.thumb.tool = 'move'; setActiveToolBtn('move'); redrawThumbCanvas();
    } else if(state.thumb.tool === 'circle' && state.thumb.drawStart){
      const dx = pos.x - state.thumb.drawStart.x, dy = pos.y - state.thumb.drawStart.y;
      state.thumb.objects.push({ type:'circle', x:state.thumb.drawStart.x, y:state.thumb.drawStart.y, r:Math.sqrt(dx*dx+dy*dy) });
      state.thumb.drawStart = null; state.thumb.tool = 'move'; setActiveToolBtn('move'); redrawThumbCanvas();
    }
    state.thumb.dragIdx = -1;
  };
  canvas.addEventListener('pointerup', finishDraw);
  canvas.addEventListener('pointercancel', ()=>{ state.thumb.dragIdx = -1; state.thumb.drawStart = null; });
}
function getCanvasPos(e, canvas){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}
function hitTestThumb(x, y){
  for(let i = state.thumb.objects.length - 1; i >= 0; i--){
    const o = state.thumb.objects[i];
    if(o.type === 'text' || o.type === 'sticker'){
      const r = (o.size || 60);
      if(Math.abs(x - o.x) < r*2 && Math.abs(y - o.y) < r*1.1) return i;
    }
  }
  return -1;
}
function drawImageCover(ctx, img, w, h){
  const ir = img.width / img.height, cr = w / h;
  let sx, sy, sw, sh;
  if(ir > cr){ sh = img.height; sw = sh*cr; sx = (img.width-sw)/2; sy = 0; }
  else { sw = img.width; sh = sw/cr; sx = 0; sy = (img.height-sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
}
function drawArrow(ctx, x1, y1, x2, y2){
  ctx.strokeStyle = '#FF3B30'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const angle = Math.atan2(y2-y1, x2-x1), headLen = 30;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen*Math.cos(angle-Math.PI/6), y2 - headLen*Math.sin(angle-Math.PI/6));
  ctx.lineTo(x2 - headLen*Math.cos(angle+Math.PI/6), y2 - headLen*Math.sin(angle+Math.PI/6));
  ctx.closePath();
  ctx.fillStyle = '#FF3B30'; ctx.fill();
}
function redrawThumbCanvas(){
  const canvas = document.getElementById('thumbCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if(state.thumb.bgImage){
    drawImageCover(ctx, state.thumb.bgImage, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#12203a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    for(let gx=0; gx<canvas.width; gx+=64){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,canvas.height); ctx.stroke(); }
    for(let gy=0; gy<canvas.height; gy+=64){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(canvas.width,gy); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '32px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Загрузите скриншот выше', canvas.width/2, canvas.height/2);
  }
  state.thumb.objects.forEach(o=>{
    if(o.type === 'text'){
      ctx.font = `900 ${o.size}px Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(4, o.size*0.12);
      ctx.strokeStyle = o.stroke;
      ctx.strokeText(o.text, o.x, o.y);
      ctx.fillStyle = o.fill;
      ctx.fillText(o.text, o.x, o.y);
    } else if(o.type === 'sticker'){
      ctx.font = `${o.size}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(o.emoji, o.x, o.y);
    } else if(o.type === 'arrow'){
      drawArrow(ctx, o.x1, o.y1, o.x2, o.y2);
    } else if(o.type === 'circle'){
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
      ctx.strokeStyle = '#FF3B30'; ctx.lineWidth = 8; ctx.stroke();
    }
  });
}

function formatTimer(ms){
  const totalSec = Math.floor(ms/1000);
  const h = String(Math.floor(totalSec/3600)).padStart(2,'0');
  const m = String(Math.floor((totalSec%3600)/60)).padStart(2,'0');
  const s = String(totalSec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function updateRecTimerDisplay(){
  const el = document.getElementById('rec-timer-display');
  if(!el) return;
  const elapsed = recTimer.elapsedBefore + (recTimer.running ? Date.now() - recTimer.startedAt : 0);
  el.textContent = formatTimer(elapsed);
}
function toggleRecTimer(){
  const btn = document.getElementById('rec-timer-toggle');
  if(recTimer.running){
    recTimer.elapsedBefore += Date.now() - recTimer.startedAt;
    recTimer.running = false;
    clearInterval(recTimer.intervalId);
    if(btn) btn.textContent = 'Старт';
  } else {
    recTimer.startedAt = Date.now();
    recTimer.running = true;
    recTimer.intervalId = setInterval(updateRecTimerDisplay, 1000);
    if(btn) btn.textContent = 'Пауза';
  }
}
function resetRecTimer(){
  clearInterval(recTimer.intervalId);
  recTimer.running = false; recTimer.elapsedBefore = 0; recTimer.marks = [];
  const btn = document.getElementById('rec-timer-toggle');
  if(btn) btn.textContent = 'Старт';
  updateRecTimerDisplay();
  renderRecMarks();
}

  const elapsed = recTimer.elapsedBefore + (recTimer.running ? Date.now() - recTimer.startedAt : 0);

}

        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      </button>
    </div>
    ${!connected ? `
      <div class="card" style="text-align:center; color:var(--ink-faint); font-size:13px; padding:20px;">
        Чтобы писать боту прямо здесь, добавьте ключ через шестерёнку сверху — GigaChat (бесплатно, без VPN) или свой ChatGPT/Gemini-совместимый доступ, если пользуетесь VPN.
      </div>
    ` : `
      <div class="card">
        <div class="chat-box" id="chat-box">
          ${messages.length === 0 ? '<div style="text-align:center;color:var(--ink-faint);font-size:12.5px;padding:10px 0;">Задайте вопрос про ваш Minecraft-канал</div>' : ''}
          ${messages.map(m => `<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`).join('')}
          ${state.gigaSending ? '<div class="msg bot">Печатает…</div>' : ''}
        </div>
        <div class="chat-input-row">
          <input id="chat-input" type="text" placeholder="Спросите про идеи, сценарий, заголовок…" onkeydown="if(event.key==='Enter') sendGigaMessage();">
          <button class="chat-send" ${state.gigaSending?'disabled':''} onclick="sendGigaMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    `}
  `;
  const box = document.getElementById('chat-box');
  if(box) box.scrollTop = box.scrollHeight;
}
function toggleProviderFields(){
  const isCustom = document.getElementById('f-provider').value === 'custom';
  document.getElementById('giga-fields').style.display = isCustom ? 'none' : 'block';
  document.getElementById('custom-fields').style.display = isCustom ? 'block' : 'none';
}
function openGigaSettings(){
  const provider = (state.giga && state.giga.provider) || 'gigachat';
  sheet.innerHTML = `
    <h3>Настройки ИИ-чата</h3>
    <div class="field">
      <label>Сервис</label>
      <select id="f-provider" onchange="toggleProviderFields()">
        <option value="gigachat" ${provider!=='custom'?'selected':''}>GigaChat — бесплатно, без VPN (Россия)</option>
        <option value="custom" ${provider==='custom'?'selected':''}>Свой сервис: ChatGPT, Gemini и другие</option>
      </select>
    </div>
    <p style="font-size:12px; color:var(--red); line-height:1.6; margin:0 0 14px;">
      ChatGPT и Gemini официально блокируют доступ с российских IP — сайт, приложение и API. Без VPN или платного стороннего сервиса они отсюда не откроются. Если это устраивает — впишите свой ключ ниже. Для варианта без VPN выбирайте GigaChat.
    </p>
    <div id="giga-fields" style="display:${provider!=='custom'?'block':'none'}">
      <p style="font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:-2px 0 12px;">
        Бесплатный ключ для физлиц (1 млн токенов на 12 месяцев) — в личном кабинете на
        <a href="https://developers.sber.ru/docs/ru/gigachat/api/tariffs" target="_blank" rel="noopener">developers.sber.ru</a>: создайте проект GigaChat API и скопируйте «Ключ авторизации» (Base64).
        Если браузер покажет ошибку соединения — установите сертификат Минцифры на <a href="https://www.gosuslugi.ru/crt" target="_blank" rel="noopener">gosuslugi.ru/crt</a>.
      </p>
      <div class="field"><label>Ключ авторизации (Base64)</label><input id="f-gigakey" type="text" value="${state.giga && state.giga.authKey ? escapeHtml(state.giga.authKey) : ''}"></div>
    </div>
    <div id="custom-fields" style="display:${provider==='custom'?'block':'none'}">
      <div class="field"><label>Адрес API (например https://api.openai.com/v1)</label><input id="f-baseurl" type="text" value="${state.giga && state.giga.baseUrl ? escapeHtml(state.giga.baseUrl) : ''}"></div>
      <div class="field"><label>API-ключ</label><input id="f-customkey" type="text" value="${state.giga && state.giga.apiKey ? escapeHtml(state.giga.apiKey) : ''}"></div>
      <div class="field"><label>Модель (например gpt-4o-mini, gemini-2.0-flash)</label><input id="f-model" type="text" value="${state.giga && state.giga.model ? escapeHtml(state.giga.model) : ''}"></div>
    </div>
    <p style="font-size:12px; color:var(--ink-faint); line-height:1.6; margin:0 0 4px;">Ключи хранятся только в этом приложении на вашем устройстве.</p>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="clearGigaChat()">Очистить чат</button>
      <button class="btn-save" onclick="submitGigaSettings()">Сохранить</button>
    </div>`;
  overlay.classList.add('open');
}
async function submitGigaSettings(){
  const provider = document.getElementById('f-provider').value;
  const prevMessages = (state.giga && state.giga.messages) || [];
  if(provider === 'custom'){
    const baseUrl = document.getElementById('f-baseurl').value.trim().replace(/\/$/, '');
    const apiKey = document.getElementById('f-customkey').value.trim();
    const model = document.getElementById('f-model').value.trim();
    if(!baseUrl || !apiKey || !model){ showToast('Заполните все поля своего сервиса'); return; }
    state.giga = { provider: 'custom', baseUrl, apiKey, model, messages: prevMessages };
  } else {
    const authKey = document.getElementById('f-gigakey').value.trim();
    if(!authKey){ showToast('Введите ключ GigaChat'); return; }
    state.giga = { provider: 'gigachat', authKey, messages: prevMessages };
  }
  await save('giga', state.giga);
  closeModal();
  renderAiChat();
}
async function clearGigaChat(){
  if(state.giga){ state.giga.messages = []; await save('giga', state.giga); }
  closeModal();
  renderAiChat();
}
async function gigaGetToken(){
  if(state.gigaToken && state.gigaTokenExp && state.gigaTokenExp > Date.now() + 5000) return state.gigaToken;
  const res = await fetch('https://ngw.devices.sberbank.ru:9443/api/v2/oauth', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded',
      'Authorization': 'Basic ' + state.giga.authKey,
      'RqUID': (crypto.randomUUID ? crypto.randomUUID() : uid())
    },
    body: 'scope=GIGACHAT_API_PERS'
  });
  const data = await res.json();
  if(!data.access_token) throw new Error(data.message || 'Не удалось получить токен');
  state.gigaToken = data.access_token;
  state.gigaTokenExp = Date.now() + 25*60*1000;
  return state.gigaToken;
}
async function sendGigaMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text || state.gigaSending) return;
  input.value = '';
  state.giga.messages = state.giga.messages || [];
  state.giga.messages.push({ role:'user', text });
  if(state.giga.messages.length > 40) state.giga.messages = state.giga.messages.slice(-40);
  state.gigaSending = true;
  renderAiChat();
  const history = state.giga.messages.filter(m=>m.role!=='system').map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.text }));
  try{
    let reply;
    if(state.giga.provider === 'custom'){
      const res = await fetch(state.giga.baseUrl + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.giga.apiKey },
        body: JSON.stringify({ model: state.giga.model, messages: history })
      });
      const data = await res.json();
      reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!reply) throw new Error((data.error && data.error.message) || 'Пустой ответ от сервиса');
    } else {
      const token = await gigaGetToken();
      const res = await fetch('https://gigachat.devices.sberbank.ru/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ model: 'GigaChat', messages: history })
      });
      const data = await res.json();
      reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!reply) throw new Error(data.message || 'Пустой ответ от GigaChat');
    }
    state.giga.messages.push({ role:'bot', text: reply });
  }catch(e){
    console.error(e);
    const hint = state.giga.provider === 'custom'
      ? 'Проверьте адрес API, ключ и что сервис доступен без VPN оттуда, где вы находитесь.'
      : 'Попробуйте кнопку «Открыть GigaChat» выше — она работает без настройки.';
    state.giga.messages.push({ role:'system', text: 'Не удалось получить ответ (' + (e.message||'ошибка сети') + '). ' + hint });
  }
  state.gigaSending = false;
  save('giga', state.giga);
  renderAiChat();
}

/* ---------- HELPERS ---------- */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function plural(n){
  const m10 = n%10, m100 = n%100;
  if(m10===1 && m100!==11) return 'а';
  if([2,3,4].includes(m10) && ![12,13,14].includes(m100)) return 'ы';
  return '';
}
function emptyState(title, sub){
  return `<div class="empty">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    <div style="font-weight:600; color:var(--ink); margin-bottom:4px;">${title}</div>
    <div>${sub}</div>
  </div>`;
}
function trashIcon(){
  return `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>`;
}

/* ---------- TABS ---------- */
const titles = {notes:'Заметки', cards:'Карточки', plan:'План', yt:'Ютуб · Minecraft'};
document.querySelectorAll('nav .tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav .tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    state.tab = btn.dataset.tab;
    if(state.tab === 'cards'){ state.reviewQueue = []; renderCards(); }
    document.getElementById('view-' + state.tab).classList.add('active');
    document.getElementById('headerTitle').textContent = titles[state.tab];
    updateFabVisibility();
  });
});
document.querySelectorAll('.yt-sub-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.yt-sub-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.yt-sub-view').forEach(v=>v.classList.remove('active'));
    state.ytSub = btn.dataset.sub;
    document.getElementById('yt-sub-' + state.ytSub).classList.add('active');
    updateFabVisibility();
  });
});
function updateFabVisibility(){
  const fab = document.getElementById('fab');
  const hide = state.tab === 'yt' && (state.ytSub === 'channel' || state.ytSub === 'ai');
  fab.style.display = hide ? 'none' : 'flex';
}
updateFabVisibility();

/* ---------- FAB / MODAL ---------- */
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
document.getElementById('fab').addEventListener('click', openModal);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
function closeModal(){ overlay.classList.remove('open'); }

function openModal(){
  if(state.tab === 'notes'){
    sheet.innerHTML = `
      <h3>Новая заметка</h3>
      <div class="field"><label>Заголовок (необязательно)</label><input id="f-title" type="text"></div>
      <div class="field"><label>Текст</label><textarea id="f-text" autofocus></textarea></div>
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal()">Отмена</button>
        <button class="btn-save" onclick="submitNote()">Сохранить</button>
      </div>`;
  } else if(state.tab === 'cards'){
    sheet.innerHTML = `
      <h3>Новая карточка</h3>
      <div class="field"><label>Вопрос / термин</label><textarea id="f-front"></textarea></div>
      <div class="field"><label>Ответ</label><textarea id="f-back"></textarea></div>
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal()">Отмена</button>
        <button class="btn-save" onclick="submitCard()">Сохранить</button>
      </div>`;
  } else if(state.tab === 'plan'){
    sheet.innerHTML = `
      <h3>Новая задача</h3>
      <div class="field"><label>Что нужно сделать</label><input id="f-task" type="text"></div>
      <div class="field"><label>Срок (необязательно)</label><input id="f-due" type="date"></div>
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal()">Отмена</button>
        <button class="btn-save" onclick="submitTask()">Сохранить</button>
      </div>`;
  } else if(state.tab === 'yt' && state.ytSub === 'ideas'){
    sheet.innerHTML = `
      <h3>Новая идея</h3>
      <div class="field"><label>О чём ролик</label><input id="f-idea" type="text" placeholder="Например: Ловушка для крипера" autofocus></div>
      <div class="field">
        <label>Формат</label>
        <div class="weekday-row" id="idea-type-row">
          <div class="weekday-chip on" data-type="video" onclick="setIdeaType('video')">Видео</div>
          <div class="weekday-chip" data-type="shorts" onclick="setIdeaType('shorts')">Shorts</div>
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal()">Отмена</button>
        <button class="btn-save" onclick="submitIdea()">Сохранить</button>
      </div>`;
    state.pendingIdeaType = 'video';
  } else {
    sheet.innerHTML = `
      <h3>Новый ролик</h3>
      <div class="field"><label>Название или идея ролика</label><input id="f-video" type="text" placeholder="Например: Строим ферму мобов"></div>
      <div class="field"><label>Серия (необязательно)</label><input id="f-video-series" type="text" placeholder="Например: 100 дней выживания"></div>
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal()">Отмена</button>
        <button class="btn-save" onclick="submitVideo()">Сохранить</button>
      </div>`;
  }
  overlay.classList.add('open');
}
function submitNote(){
  const title = document.getElementById('f-title').value.trim();
  const text = document.getElementById('f-text').value.trim();
  if(!text){ showToast('Введите текст заметки'); return; }
  state.notes.push({ id: uid(), title, text, updated: Date.now() });
  save('notes', state.notes);
  renderNotes(); closeModal();
}
function submitCard(){
  const front = document.getElementById('f-front').value.trim();
  const back = document.getElementById('f-back').value.trim();
  if(!front || !back){ showToast('Заполните обе стороны'); return; }
  state.cards.push({ id: uid(), front, back, created: Date.now(), nextReview: null });
  save('cards', state.cards);
  renderCards(); closeModal();
}
function submitTask(){
  const text = document.getElementById('f-task').value.trim();
  const dueVal = document.getElementById('f-due').value;
  if(!text){ showToast('Введите задачу'); return; }
  const due = dueVal ? new Date(dueVal + 'T00:00:00').getTime() : null;
  state.tasks.push({ id: uid(), text, due, done:false, created: Date.now() });
  save('tasks', state.tasks);
  renderTasks(); closeModal();
}

loadAll();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
